<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sign in · NOC Monitor</title>
  <link rel="stylesheet" href="/static/css/noc.css?v=6">
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand login-brand" href="/login"><span class="brand-mark">N</span><span><strong>NOC</strong><small>CONTROL ROOM</small></span></a>
    <div class="login-language-switcher" role="group" aria-label="Language" data-i18n-aria-label="language"><button class="button secondary language-button" id="lang-vi" type="button" aria-pressed="true">VI</button><button class="button secondary language-button" id="lang-en" type="button" aria-pressed="false">EN</button></div>
    <p class="eyebrow" data-i18n="networkOperations">NETWORK OPERATIONS</p>
    <h1 data-i18n="loginTitle">Sign in to NOC Monitor</h1>
    <p class="subheading" data-i18n="loginSubtitle">Use your NOC account to open the monitoring dashboard.</p>
    <div id="setup-notice" class="notice" hidden>
      <strong data-i18n="firstUse">First use</strong>
      <p data-i18n="firstUseDescription">Create the first Global Admin from PowerShell in the project folder:</p>
      <code>.\.venv\Scripts\python.exe -m noc.auth_cli bootstrap</code>
    </div>
    <form id="login-form" class="login-form">
      <label class="field"><span data-i18n="username">Username</span><input name="username" autocomplete="username" required minlength="3" maxlength="64"></label>
      <label class="field"><span data-i18n="password">Password</span><input name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
      <p id="auth-error" class="login-error" role="alert" hidden></p>
      <button class="button primary login-submit" type="submit" data-i18n="signIn">Sign in</button>
    </form>
    <p class="login-footnote" data-i18n="loginFootnote">Access is managed by your NOC administrator.</p>
  </main>
  <script src="/static/js/login.js?v=2"></script>
</body>
</html>
