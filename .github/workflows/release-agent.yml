name: Package remote agent

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  agent-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone agent bundle
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir bundle
          cp agent/run_agent.py agent/requirements.txt agent/README.md LinuxSetup/Agent/noc-agent.service LinuxSetup/Agent/install_linux.sh WindowSetup/Agent/install_windows.ps1 WindowSetup/Agent/start_agent.ps1 bundle/
          (cd bundle && zip -q -r "../noc-monitor-agent-${version}.zip" .)
      - name: Publish GitHub release and agent bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "noc-monitor-agent-${GITHUB_REF_NAME#v}.zip" --title "NOC Monitor $GITHUB_REF_NAME" --generate-notes
